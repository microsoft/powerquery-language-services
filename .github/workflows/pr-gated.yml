name: Gated pull request
on:
    workflow_dispatch:
    pull_request:
        branches: [master]
    push:
        branches: [master]
permissions:
    contents: read
jobs:
    build-and-test:
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
            - name: Setup Node
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
              with:
                  node-version-file: "package.json"
                  cache: npm
            - run: npm ci --ignore-scripts
            - run: npm run lint
            - run: npm run clean
            - run: npm run build
            - name: Verify clean rebuild
              run: npm run clean && npm run build
            - run: npm test
            - name: Validate standalone release consumers
              run: npm run validate:release
            - name: Collect JUnit results
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: test-results
                  path: packages/**/test-results*.xml
                  if-no-files-found: error
            - name: Collect npm package tarballs
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: diagnostic-packages
                  path: |
                      dist/npm/**/*.tgz
                      dist/release-manifest.json
                  if-no-files-found: error
