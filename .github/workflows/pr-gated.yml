name: Gated pull request
on:
    workflow_dispatch:
    pull_request:
        branches: [master]
jobs:
    build-and-test:
        runs-on: windows-latest
        permissions:
            contents: read
            actions: read
            checks: write
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: setup node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: "package.json"
            - run: node -v
            - run: npm ci
            - name: Run npm audit
              continue-on-error: true
              run: npm audit
            - run: npm run lint
            - run: npm run build
            - name: Run tests
              run: npm run test
            - name: Publish test results
              uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
              if: success() || failure()
              with:
                  name: Mocha Tests
                  path: test-results.xml
                  reporter: java-junit
                  fail-on-error: true
